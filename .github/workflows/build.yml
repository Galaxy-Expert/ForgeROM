name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "Banner.png"
      - "*.jpg"
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project from ForgeROM.zip
        run: unzip -q ForgeROM.zip -d work

      - name: Apply custom icons (if present)
        run: |
          D=work/ForgeROM/app/src/main/res/drawable-xxxhdpi
          [ -f app/images/icon_foreground.png ] && cp app/images/icon_foreground.png $D/ic_launcher_foreground.png || true
          [ -f app/images/icon_background.png ] && cp app/images/icon_background.png $D/ic_launcher_background.png || true

      - name: Merge community strings (app/strings)
        run: |
          python3 - <<'PY'
          import os, shutil
          import xml.etree.ElementTree as ET

          SRC = "app/strings"
          DST = "work/ForgeROM/app/src/main/res"
          if not os.path.isdir(SRC):
              raise SystemExit("No app/strings folder, nothing to merge")

          for folder in sorted(os.listdir(SRC)):
              if not folder.startswith("values"):
                  continue
              src = os.path.join(SRC, folder, "strings.xml")
              if not os.path.isfile(src) or os.path.getsize(src) == 0:
                  print(f"skip {folder}: no strings.xml")
                  continue
              try:
                  src_tree = ET.parse(src)
              except ET.ParseError as e:
                  print(f"::warning::{src} is not valid XML ({e}), skipped")
                  continue

              dst_dir = os.path.join(DST, folder)
              dst = os.path.join(dst_dir, "strings.xml")
              os.makedirs(dst_dir, exist_ok=True)
              if not os.path.isfile(dst):
                  shutil.copy(src, dst)
                  print(f"added new language folder: {folder}")
                  continue

              # Existing language: keys from the repo override the zip, missing keys fall back to the zip.
              dst_tree = ET.parse(dst)
              dst_root = dst_tree.getroot()
              by_name = {el.get("name"): el for el in dst_root.findall("string")}
              count = 0
              for el in src_tree.getroot().findall("string"):
                  name = el.get("name")
                  if name in by_name:
                      by_name[name].text = el.text
                  else:
                      dst_root.append(el)
                  count += 1
              dst_tree.write(dst, encoding="utf-8", xml_declaration=True)
              print(f"merged {count} strings into {folder}")
          PY

      - name: Generate language list from values-xx folders
        run: |
          python3 - <<'PY'
          import os, re

          RES = "work/ForgeROM/app/src/main/res"
          tags = ["en"]
          for folder in sorted(os.listdir(RES)):
              m = re.fullmatch(r"values-(b\+[A-Za-z0-9+]+|[a-z]{2,3}(?:-r[A-Z]{2})?)", folder)
              if not m or not os.path.isfile(os.path.join(RES, folder, "strings.xml")):
                  continue
              q = m.group(1)
              # values-pt-rBR -> pt-BR, values-b+sr+Latn -> sr-Latn
              tag = q[2:].replace("+", "-") if q.startswith("b+") else q.replace("-r", "-")
              if tag not in tags:
                  tags.append(tag)

          tags = ["en"] + sorted(t for t in tags if t != "en")

          with open(os.path.join(RES, "xml", "locales_config.xml"), "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<locale-config xmlns:android="http://schemas.android.com/apk/res/android">\n')
              for t in tags:
                  f.write(f'    <locale android:name="{t}" />\n')
              f.write('</locale-config>\n')

          with open(os.path.join(RES, "values", "supported_languages.xml"), "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
              f.write('    <string-array name="supported_languages" translatable="false">\n')
              for t in tags:
                  f.write(f'        <item>{t}</item>\n')
              f.write('    </string-array>\n</resources>\n')

          print("Languages:", ", ".join(tags))
          PY

      - name: Read app version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' work/ForgeROM/app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare signing key (if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forgerom.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/forgerom.jks" >> "$GITHUB_ENV"
            echo "Signing with the ForgeROM release key"
          else
            echo "::warning::No signing secrets found, falling back to the debug key"
          fi

      - name: Build release APK
        working-directory: work/ForgeROM
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs work/ForgeROM/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          else
            echo "apksigner not found, skipping"
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp work/ForgeROM/app/build/outputs/apk/release/app-release.apk "dist/ForgeROM_${{ steps.ver.outputs.version }}.apk"

      # Note: GitHub always delivers artifacts as a .zip from the Actions page.
      # For a bare .apk download, use the Release option below.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeROM_${{ steps.ver.outputs.version }}
          path: dist/ForgeROM_${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="dist/ForgeROM_${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "ForgeROM ${{ steps.ver.outputs.version }}" --prerelease --generate-notes
          fi
