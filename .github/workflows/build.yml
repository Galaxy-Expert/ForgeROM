name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projeyi zip'ten çıkar
        run: unzip -q ForgeROM.zip -d work

      - name: Özel ikonları uygula (varsa)
        run: |
          D=work/ForgeROM/app/src/main/res/drawable-xxxhdpi
          [ -f icon_foreground.png ] && cp icon_foreground.png $D/ic_launcher_foreground.png || true
          [ -f icon_background.png ] && cp icon_background.png $D/ic_launcher_background.png || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: APK derle
        working-directory: work/ForgeROM
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeROM-debug-apk
          path: work/ForgeROM/app/build/outputs/apk/debug/app-debug.apk
