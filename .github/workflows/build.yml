name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "Banner.png"
      - "*.jpg"
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # If ForgeROM.zip is in the repository root, unpack it over the sources, commit, and delete the zip.
      # Nothing else is ever deleted. README, LICENSE, .github and app/images are never overwritten.
      - name: Import project from ForgeROM.zip (if present)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f ForgeROM.zip ]; then
            echo "No ForgeROM.zip, building the sources that are already in the repository"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/import"
          mkdir -p "$RUNNER_TEMP/import"
          unzip -q ForgeROM.zip -d "$RUNNER_TEMP/import"
          python3 - <<'PY'
          import os, re, shutil
          import xml.etree.ElementTree as ET

          SRC_ROOT = os.path.join(os.environ["RUNNER_TEMP"], "import")
          entries = os.listdir(SRC_ROOT)
          if len(entries) == 1 and os.path.isdir(os.path.join(SRC_ROOT, entries[0])):
              SRC_ROOT = os.path.join(SRC_ROOT, entries[0])   # the zip has one top-level folder

          PROTECTED_DIRS = (".github/", "app/images/", "app/strings/")
          PROTECTED_FILES = {"LICENSE", "Banner.png"}
          KEEP_IF_EXISTS = {
              "README.md",
              "app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png",
              "app/src/main/res/drawable-xxxhdpi/ic_launcher_background.png",
          }
          STRINGS = re.compile(r"app/src/main/res/values[^/]*/strings\.xml")

          def merge_missing_keys(src, dst):
              """Keep the strings already in the repository, add only the keys that are missing."""
              dst_tree = ET.parse(dst)
              root = dst_tree.getroot()
              have = {el.get("name") for el in root.findall("string")}
              added = 0
              for el in ET.parse(src).getroot().findall("string"):
                  if el.get("name") not in have:
                      root.append(el)
                      added += 1
              if added:
                  dst_tree.write(dst, encoding="utf-8", xml_declaration=True)
              return added

          def merge_gitignore(src, dst):
              have = set(open(dst, encoding="utf-8").read().splitlines())
              missing = [l for l in open(src, encoding="utf-8").read().splitlines()
                         if l.strip() and not l.startswith("#") and l not in have]
              if missing:
                  with open(dst, "a", encoding="utf-8") as f:
                      f.write("\n" + "\n".join(missing) + "\n")
              return len(missing)

          copied = kept = merged = 0
          for base, _, files in os.walk(SRC_ROOT):
              for name in files:
                  src = os.path.join(base, name)
                  rel = os.path.relpath(src, SRC_ROOT).replace(os.sep, "/")
                  if rel.startswith(PROTECTED_DIRS) or rel in PROTECTED_FILES:
                      kept += 1
                      continue
                  if rel in KEEP_IF_EXISTS and os.path.exists(rel):
                      kept += 1
                      continue
                  if rel == ".gitignore" and os.path.exists(rel):
                      merged += merge_gitignore(src, rel)
                      continue
                  if STRINGS.fullmatch(rel) and rel != "app/src/main/res/values/strings.xml" and os.path.exists(rel):
                      merged += merge_missing_keys(src, rel)
                      continue
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  shutil.copyfile(src, rel)
                  copied += 1
          print(f"import finished: {copied} files copied, {kept} protected files left alone, {merged} missing entries merged")
          PY
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "unknown")
          git rm -q ForgeROM.zip
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Import ForgeROM $VER from ForgeROM.zip"
          for i in 1 2 3; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            sleep 3
          done

      - name: Apply custom icons and fit the foreground into the safe zone
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import math, os, shutil, sys
          from PIL import Image

          SRC_FG = "app/images/icon_foreground.png"
          SRC_BG = "app/images/icon_background.png"
          DST = "app/src/main/res/drawable-xxxhdpi"
          # Android shows only the middle of the icon (a circle of about 61% of the canvas is always visible).
          # The farthest visible pixel of the foreground must stay within this fraction of the canvas from the centre.
          TARGET = 0.28

          if os.path.isfile(SRC_BG):
              shutil.copy(SRC_BG, os.path.join(DST, "ic_launcher_background.png"))
              print("background icon applied")

          if not os.path.isfile(SRC_FG):
              print("no custom foreground, using the template")
              sys.exit(0)

          img = Image.open(SRC_FG).convert("RGBA")
          w, h = img.size
          alpha = img.getchannel("A")
          out = os.path.join(DST, "ic_launcher_foreground.png")

          if alpha.getextrema()[0] == 255:
              print("::warning::icon_foreground.png has no transparent pixels, so it cannot be fitted automatically. Use a transparent background.")
              img.save(out)
              sys.exit(0)

          px = alpha.load()
          cx, cy = w / 2, h / 2
          far = 0.0
          for y in range(h):
              for x in range(w):
                  if px[x, y] > 24:
                      far = max(far, math.hypot(x + 0.5 - cx, y + 0.5 - cy))
          if far == 0:
              print("::warning::icon_foreground.png is fully transparent")
              img.save(out)
              sys.exit(0)

          ratio = far / min(w, h)
          print(f"foreground {w}x{h}: farthest visible pixel is at {ratio:.2f} of the canvas (limit {TARGET})")
          if ratio > TARGET:
              scale = TARGET / ratio
              small = img.resize((max(1, round(w * scale)), max(1, round(h * scale))), Image.LANCZOS)
              canvas = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              canvas.paste(small, ((w - small.width) // 2, (h - small.height) // 2), small)
              img = canvas
              print(f"scaled the symbol to {scale * 100:.0f}% so it stays inside the safe zone")
          else:
              print("already inside the safe zone, left unchanged")
          img.save(out)
          PY

      - name: Upload icon preview (the layers exactly as used in the app)
        uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: app/src/main/res/drawable-xxxhdpi/ic_launcher_*.png

      - name: Generate language list from values-xx folders
        run: |
          python3 - <<'PY'
          import os, re

          RES = "app/src/main/res"
          tags = ["en"]
          for folder in sorted(os.listdir(RES)):
              m = re.fullmatch(r"values-(b\+[A-Za-z0-9+]+|[a-z]{2,3}(?:-r[A-Z]{2})?)", folder)
              if not m or not os.path.isfile(os.path.join(RES, folder, "strings.xml")):
                  continue
              q = m.group(1)
              # values-pt-rBR -> pt-BR, values-b+sr+Latn -> sr-Latn
              tag = q[2:].replace("+", "-") if q.startswith("b+") else q.replace("-r", "-")
              if tag not in tags:
                  tags.append(tag)
          tags = ["en"] + sorted(t for t in tags if t != "en")

          with open(os.path.join(RES, "xml", "locales_config.xml"), "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<locale-config xmlns:android="http://schemas.android.com/apk/res/android">\n')
              for t in tags:
                  f.write(f'    <locale android:name="{t}" />\n')
              f.write('</locale-config>\n')

          with open(os.path.join(RES, "values", "supported_languages.xml"), "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
              f.write('    <string-array name="supported_languages" translatable="false">\n')
              for t in tags:
                  f.write(f'        <item>{t}</item>\n')
              f.write('    </string-array>\n</resources>\n')

          print("Languages:", ", ".join(tags))
          PY

      - name: Check string resources
        run: |
          python3 - <<'PY'
          import glob, re, sys
          import xml.dom.minidom as minidom

          ROOT = "app/src/main"
          errors = []

          def names(path):
              return set(re.findall(r'<string name="([^"]+)"', open(path, encoding="utf-8").read()))

          for f in glob.glob(ROOT + "/res/**/*.xml", recursive=True):
              try:
                  minidom.parse(f)
              except Exception as e:
                  errors.append(f"{f}: invalid XML ({e})")

          english = names(ROOT + "/res/values/strings.xml")
          used = set()
          for f in glob.glob(ROOT + "/java/**/*.kt", recursive=True):
              used |= set(re.findall(r"R\.string\.([A-Za-z0-9_]+)", open(f, encoding="utf-8").read()))
          missing = sorted(used - english)
          if missing:
              errors.append("used in code but missing from values/strings.xml: " + ", ".join(missing))

          for f in glob.glob(ROOT + "/res/values*/strings.xml"):
              text = open(f, encoding="utf-8").read()
              for name, value in re.findall(r'<string name="([^"]+)"[^>]*>([^<]*)</string>', text):
                  if value[:1] in ("?", "@"):
                      errors.append(f"{f}: '{name}' starts with ? or @ (escape it with a backslash)")
                  if not value.startswith('"') and re.search(r"(?<!\\)'", value):
                      errors.append(f"{f}: '{name}' has an unescaped apostrophe (use \\')")
              if "/values-" in f:
                  lacking = sorted(english - names(f) - {"app_name", "version_label"})
                  if lacking:
                      print(f"::warning::{f} lacks {len(lacking)} strings, they fall back to English")

          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Read app version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run unit tests (does not block the build)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Prepare signing key (if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forgerom.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/forgerom.jks" >> "$GITHUB_ENV"
            echo "Signing with the ForgeROM release key"
          else
            echo "::warning::No signing secrets found, falling back to the debug key"
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          else
            echo "apksigner not found, skipping"
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ForgeROM_${{ steps.ver.outputs.version }}.apk"

      # Note: GitHub always delivers artifacts as a .zip from the Actions page.
      # For a bare .apk download, use the Release option below.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeROM_${{ steps.ver.outputs.version }}
          path: dist/ForgeROM_${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="dist/ForgeROM_${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "ForgeROM ${{ steps.ver.outputs.version }}" --prerelease --generate-notes
          fi
